<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Wonderland AI</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#17152f,#39245d);
  color: white;
  padding: 20px;
  text-align: center;
}
.container {
  max-width: 500px;
  margin: auto;
  background: #252141;
  padding: 22px;
  border-radius: 20px;
}
textarea, select, button {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin-top: 14px;
  border-radius: 10px;
  font-size: 16px;
}
textarea { height: 140px; }
button {
  background: #ff70b5;
  color: white;
  border: 0;
  font-weight: bold;
}
#hasil { margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>🎬 Kids Wonderland AI</h1>
  <p>Ubah ceritamu menjadi ide animasi 3D!</p>

  <textarea id="cerita"
    placeholder="Tuliskan cerita kamu di sini..."></textarea>

  <select id="gaya">
    <option>Animasi 3D lucu</option>
    <option>Kartun 3D sinematik</option>
    <option>Animasi fantasi</option>
    <option>Animasi anak-anak</option>
  </select>

  <select id="durasi">
    <option value="5">5 detik</option>
    <option value="10">10 detik</option>
    <option value="15">15 detik</option>
    <option value="30">30 detik</option>
  </select>

  <button onclick="buatVideo()">✨ BUAT VIDEO</button>
  <div id="hasil"></div>
</div>

<script>
function buatVideo() {
  const cerita = document.getElementById("cerita").value.trim();
  const gaya = document.getElementById("gaya").value;
  const durasi = document.getElementById("durasi").value;
  const hasil = document.getElementById("hasil");

  if (!cerita) {
    hasil.textContent = "Silakan tulis ceritamu terlebih dahulu.";
    return;
  }

  hasil.textContent =
    "Cerita siap diproses! Gaya: " + gaya +
    ". Durasi: " + durasi +
    " detik. Mesin AI video belum dihubungkan.";
}
</script>
</body>
</html>
