<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wonderland Real Video</title><style>body{font-family:Arial;background:#ffd6e8;margin:0;padding:15px;text-align:center}.card{background:#fff;max-width:500px;margin:auto;border-radius:25px;padding:20px}textarea{width:92%;height:100px;border-radius:12px;padding:10px;border:2px solid #ff8fab}.btn{background:#ff3e8d;color:#fff;border:none;padding:14px;border-radius:30px;width:92%;margin:6px;font-weight:bold;font-size:16px}canvas,video{width:100%;border-radius:15px;margin-top:10px;background:#000}</style></head><body><div class="card"><h1>🐰 Wonderland 🦋<br>Text to REAL Video</h1><textarea id="p">Seekor kelinci coklat memakai tas wortel dan sepatu wortel berjalan di hutan mencari mawar kuning, bertemu kupu-kupu raksasa cantik</textarea><button class="btn" onclick="go()">✨ Buat Video Beneran</button><button class="btn" style="background:#7b2cbf" onclick="speechSynthesis.speak(new SpeechSynthesisUtterance(document.getElementById('p').value))">🔊 Suara</button><div id="st" style="margin:10px;font-weight:bold;color:#ff3e8d"></div><progress id="pr" style="display:none;width:90%"></progress><div id="box" style="display:none"><canvas id="c" width="720" height="1280"></canvas><video id="v" controls style="display:none"></video><a id="dl" style="display:none;background:#00c853;color:#fff;padding:12px;border-radius:20px;text-decoration:none;font-weight:bold;margin-top:8px;display:block">⬇️ Download Video</a><div id="pre"></div></div></div><script>let imgs=[];const cv=document.getElementById('c'),cx=cv.getContext('2d');async function go(){const st=document.getElementById('st'),pr=document.getElementById('pr'),box=document.getElementById('box');st.innerText='Membuat gambar...';pr.style.display='block';box.style.display='block';document.getElementById('pre').innerHTML='';imgs=[];let sc=[`cute brown bunny wearing carrot bag and carrot shoes walking in magical forest looking for yellow rose, kawaii 3d pixar`,`cute brown bunny meeting giant beautiful blue butterfly in forest, friendship glow, pixar style`,`cute bunny and giant butterfly in colorful flower garden with yellow roses, happy, rainbow`];for(let i=0;i<3;i++){st.innerText=`Gambar ${i+1}/3...`;pr.value=(i+1)*30;let u=`https://image.pollinations.ai/prompt/${encodeURIComponent(sc[i])}?width=720&height=1280&seed=${Math.floor(Math.random()*9999)}&nologo=true`;let im=new Image();im.crossOrigin='anonymous';await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=u});imgs.push(im);let p=document.createElement('img');p.src=u;p.style.width='100%';p.style.borderRadius='12px';p.style.marginTop='6px';document.getElementById('pre').appendChild(p)}st.innerText='Jadi video 15 detik...';let stream=cv.captureStream(30),rec=new MediaRecorder(stream),ch=[];rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{let b=new Blob(ch,{type:'video/webm'}),url=URL.createObjectURL(b),vv=document.getElementById('v');vv.src=url;vv.style.display='block';let d=document.getElementById('dl');d.href=url;d.download='wonderland.webm';d.style.display='block';st.innerText='✅ Video Jadi! Download di bawah!';pr.value=100};rec.start();let s=Date.now(),D=15000,SD=D/3;function dr(){let e=Date.now()-s;if(e>D){rec.stop();return}let si=Math.floor(e/SD);if(si>2)si=2;let sp=(e%SD)/SD;let im=imgs[si],z=1+sp*0.3,w=cv.width*z,h=cv.height*z,x=(cv.width-w)/2-sp*20,y=(cv.height-h)/2;cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(im,x,y,w,h);cx.fillStyle='rgba(0,0,0,0.5)';cx.fillRect(0,cv.height-120,cv.width,120);cx.fillStyle='white';cx.font='bold 20px Arial';cx.textAlign='center';cx.fillText(['Kelinci cari mawar','Ketemu kupu-kupu','Taman bunga!'][si],cv.width/2,cv.height-40);requestAnimationFrame(dr)}dr()}</script></body></html>
