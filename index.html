<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FINAL TERBAIK</title>
<style>
body{background:#0f172a;color:#fff;font-family:Arial;text-align:center;padding:10px;margin:0}
.card{max-width:560px;margin:auto;background:#1e293b;border-radius:20px;padding:16px}
textarea{width:92%;height:80px;border-radius:12px;padding:10px}
.btn{background:linear-gradient(90deg,#ff3e8d,#06ffa5);color:#000;border:none;padding:15px;width:92%;border-radius:25px;font-weight:bold;margin:6px;cursor:pointer;font-size:17px}
canvas,video{width:100%;border-radius:16px;background:#000;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h2>🏆 FINAL TERBAIK</h2>
<p style="font-size:11px;color:#06ffa5">Anti Limit + Halus + Suara AI</p>
<textarea id="story">Kelinci putih lari kejar kupu kuning di tepi sungai, terpeleset jatuh, berenang takut, buaya tolong, mereka berteman melihat sunset, persahabatan dalam kejujuran</textarea>
<button class="btn" onclick="make()">🎬 BUAT VIDEO FINAL 30 DETIK</button>
<div id="s" style="color:#06ffa5;font-weight:bold;margin:8px"></div>
<div id="box" style="display:none">
<canvas id="c" width="720" height="1280"></canvas>
<video id="v" controls style="display:none"></video>
<a id="dl" style="display:none;background:#3b82f6;color:#fff;padding:12px;border-radius:15px;display:block;margin-top:8px;text-decoration:none;font-weight:bold">⬇️ Download Video Final</a>
</div>
</div>
<script>
let cv=document.getElementById('c'),cx=cv.getContext('2d');
function ease(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function lerp(a,b,t){return a+(b-a)*t}
function drawBunny(x,y,s,r,leg){
 cx.save();cx.translate(x,y);cx.rotate(r);cx.scale(s,s);
 cx.fillStyle='#fff';cx.beginPath();cx.ellipse(0,20,45,50,0,0,6.28);cx.fill();
 cx.fillStyle='#fff';cx.beginPath();cx.ellipse(-18,-35,12,35, -0.2,0,6.28);cx.fill();
 cx.beginPath();cx.ellipse(18,-35,12,35, 0.2,0,6.28);cx.fill();
 cx.fillStyle='#ffb6d9';cx.beginPath();cx.ellipse(-18,-35,5,18,-0.2,0,6.28);cx.fill();
 cx.beginPath();cx.ellipse(18,-35,5,18,0.2,0,6.28);cx.fill();
 cx.fillStyle='#fff';cx.beginPath();cx.ellipse(0,-5,38,32,0,0,6.28);cx.fill();
 cx.fillStyle='#000';cx.beginPath();cx.arc(-10,-8,4,0,6.28);cx.arc(10,-8,4,0,6.28);cx.fill();
 cx.fillStyle='#ff6b9d';cx.beginPath();cx.arc(0,0,3,0,6.28);cx.fill();
 cx.fillStyle='#fff';cx.beginPath();cx.ellipse(-15,35,12,18, leg,0,6.28);cx.ellipse(15,35,12,18, -leg,0,6.28);cx.fill();
 cx.restore();
}
function drawButterfly(x,y,t){
 cx.save();cx.translate(x,y);cx.rotate(Math.sin(t*0.01)*0.3);
 cx.fillStyle='#ffeb3b';cx.globalAlpha=0.9;
 cx.beginPath();cx.ellipse(-18,0,18,28, -0.3,0,6.28);cx.fill();
 cx.beginPath();cx.ellipse(18,0,18,28, 0.3,0,6.28);cx.fill();
 cx.fillStyle='#ff9800';cx.beginPath();cx.ellipse(-18,0,9,14,-0.3,0,6.28);cx.fill();
 cx.beginPath();cx.ellipse(18,0,9,14,0.3,0,6.28);cx.fill();
 cx.fillStyle='#333';cx.fillRect(-2,-12,4,24);cx.restore();
}
function drawCroc(x,y,s){
 cx.save();cx.translate(x,y);cx.scale(s,s);
 cx.fillStyle='#2ecc71';cx.beginPath();cx.ellipse(0,0,90,35,0,0,6.28);cx.fill();
 cx.beginPath();cx.ellipse(70,0,45,28,0,0,6.28);cx.fill();
 cx.fillStyle='#fff';cx.beginPath();cx.arc(85,-8,5,0,6.28);cx.arc(95,-8,5,0,6.28);cx.fill();
 cx.fillStyle='#000';cx.beginPath();cx.arc(86,-8,2,0,6.28);cx.arc(96,-8,2,0,6.28);cx.fill();
 cx.fillStyle='#2ecc71';cx.beginPath();cx.ellipse(-60,20,18,12,0,0,6.28);cx.ellipse(-40,25,18,12,0,0,6.28);cx.fill();
 cx.restore();
}
function speak(txt){
 let v=speechSynthesis.getVoices().find(x=>x.lang.includes('id'))||speechSynthesis.getVoices()[0];
 let u=new SpeechSynthesisUtterance(txt);u.voice=v;u.lang='id-ID';u.rate=0.95;u.pitch=1.1;speechSynthesis.speak(u);
}
function make(){
 let st=document.getElementById('s'),box=document.getElementById('box');
 box.style.display='block';st.innerText='Render FINAL 30 detik...';
 let stream=cv.captureStream(60);let rec=new MediaRecorder(stream,{mimeType:'video/webm'});let ch=[];
 rec.ondataavailable=e=>{if(e.data.size>0)ch.push(e.data)};
 rec.onstop=()=>{let b=new Blob(ch,{type:'video/webm'});let u=URL.createObjectURL(b);let vv=document.getElementById('v');vv.src=u;vv.style.display='block';let dl=document.getElementById('dl');dl.href=u;dl.download='FINAL-TERBAIK.webm';dl.style.display='block';st.innerText='✅ FINAL TERBAIK JADI! Anti limit!';};
 rec.start(50);
 speak(document.getElementById('story').value);
 let start=Date.now(),total=30000;
 function Draw(){
  let el=Date.now()-start;if(el>total){rec.stop();speechSynthesis.cancel();return;}
  let p=el/total;let e=ease((el%7500)/7500);let scene=Math.floor(el/7500);
  // background
  let grad=cx.createLinearGradient(0,0,0,cv.height);
  if(scene<3){grad.addColorStop(0,'#87CEEB');grad.addColorStop(1,'#a8e6cf');}
  else{grad.addColorStop(0,'#ff8a65');grad.addColorStop(1,'#ffcc80');}
  cx.fillStyle=grad;cx.fillRect(0,0,cv.width,cv.height);
  cx.fillStyle='#4fc3f7';cx.fillRect(0,cv.height*0.65,cv.width,cv.height*0.35);
  cx.fillStyle='#81c784';cx.fillRect(0,cv.height*0.58,cv.width,120);
  let bunnyX=0,bunnyY=0,bunnyR=0,leg=0,bflyX=0,bflyY=0;
  if(scene==0){
   bunnyX=lerp(100,400,e*7500/100);bunnyY=cv.height*0.6+Math.abs(Math.sin(e*12))* -30;
   leg=Math.sin(e*20)*0.5;bflyX=450+Math.sin(el*0.005)*30;bflyY=300+Math.cos(el*0.004)*20;
   cx.fillStyle='rgba(0,0,0,0.6)';cx.fillRect(0,cv.height-150,cv.width,150);
   cx.fillStyle='white';cx.font='bold 20px Arial';cx.textAlign='center';cx.fillText('Kelinci lari kejar kupu kuning',cv.width/2,cv.height-80);
  }else if(scene==1){
   let fall=e*e;bunnyX=lerp(350,280,fall);bunnyY=lerp(cv.height*0.6,cv.height*0.8,fall);bunnyR=fall*0.8;
   bflyX=300;bflyY=280;cx.fillStyle='rgba(120,200,255,'+(1-fall)*0.5+')';for(let i=0;i<15;i++){cx.beginPath();cx.arc(Math.random()*cv.width,cv.height*0.65+Math.random()*150,4,0,6.28);cx.fill();}
   cx.fillStyle='rgba(0,0,0,0.6)';cx.fillRect(0,cv.height-150,cv.width,150);cx.fillStyle='white';cx.font='bold 20px Arial';cx.textAlign='center';cx.fillText('Terpeleset jatuh ke sungai!',cv.width/2,cv.height-80);
  }else if(scene==2){
   bunnyX=320+Math.sin(el*0.008)*30;bunnyY=cv.height*0.78+Math.sin(el*0.01)*10;leg=Math.sin(el*0.02)*0.8;
   bflyX=200+Math.sin(el*0.005)*20;bflyY=250;
   drawCroc(lerp(-100,180,e),cv.height*0.82,1.2);
   cx.fillStyle='rgba(0,0,0,0.6)';cx.fillRect(0,cv.height-150,cv.width,150);cx.fillStyle='white';cx.font='bold 20px Arial';cx.textAlign='center';cx.fillText('Buaya baik menolongnya',cv.width/2,cv.height-80);
  }else{
   bunnyX=250;bunnyY=cv.height*0.65;bflyX=350+Math.sin(el*0.003)*15;bflyY=280+Math.cos(el*0.003)*10;
   drawCroc(180,cv.height*0.82,1.2);
   cx.fillStyle='rgba(0,0,0,0.3)';cx.fillRect(0,0,cv.width,cv.height);
   cx.fillStyle='white';cx.font='bold 36px Arial';cx.textAlign='center';cx.fillText('Persahabatan',cv.width/2,cv.height/2-20);cx.font='bold 26px Arial';cx.fillText('dalam Kejujuran',cv.width/2,cv.height/2+20);
  }
  drawButterfly(bflyX,bflyY,el);
  drawBunny(bunnyX,bunnyY,1.4,bunnyR,leg);
  cx.fillStyle='#06ffa5';cx.fillRect(0,cv.height-5,(p*cv.width),5);
  requestAnimationFrame(Draw);
 }Draw();
}
</script>
</body>
</html>
