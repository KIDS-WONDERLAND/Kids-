<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRIP ASLI CANTIK</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;text-align:center;padding:10px;margin:0}
.card{background:#1e293b;max-width:560px;margin:auto;border-radius:20px;padding:16px}
textarea{width:92%;height:70px;border-radius:12px;padding:10px}
.btn{background:linear-gradient(90deg,#ff3e8d,#06ffa5);color:#000;border:none;padding:15px;width:92%;border-radius:25px;font-weight:bold;margin:6px;font-size:17px}
canvas,video{width:100%;border-radius:16px;background:#000;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h2>✨ MIRIP ASLI 100%</h2>
<p style="color:#06ffa5;font-size:11px">Sama Persis Kayak Video Referensi</p>
<textarea id="story">Kelinci putih fluffy kejar kupu kuning di tepi sungai rumput hijau bunga warna warni
Kelinci jatuh terpeleset ke sungai air beriak
Kelinci berenang takut di air gelembung
Buaya hijau besar gigi tajam muncul dekat kelinci
Buaya bawa kelinci di mulut ke tepi sunset orange
Kelinci peluk terima kasih buaya baik
Kelinci dan buaya duduk bersama lihat sunset Persahabatan dalam Kejujuran</textarea>
<button class="btn" onclick="make()">🎬 BUAT VIDEO MIRIP ASLI 30 DETIK</button>
<div id="s" style="color:#06ffa5;font-weight:bold;margin:8px"></div>
<div id="count" style="color:#fbbf24;font-size:12px"></div>
<progress id="p" style="display:none;width:90%"></progress>
<div id="box" style="display:none">
<canvas id="c" width="720" height="1280"></canvas>
<video id="v" controls style="display:none"></video>
<a id="dl" style="display:none;background:#ff3e8d;color:#fff;padding:12px;border-radius:15px;display:block;margin-top:8px;text-decoration:none;font-weight:bold">⬇️ Download Video Mirip Asli</a>
</div>
</div>
<script>
let cv=document.getElementById('c'),cx=cv.getContext('2d'),IM=[];
let PROMPTS=[
"ultra realistic pixar 3d, white fluffy bunny with big blue eyes sitting on green grass riverbank, yellow butterfly flying, small river with white water, mossy log, wildflowers, sunny blue sky, forest background, cinematic lighting, 8k, highly detailed fur",
"close up white fluffy bunny jumping reaching for yellow butterfly with paws up, cute, grassy cliff edge, sunny day, pixar style, ultra detailed",
"white bunny falling into river, splashing water, muddy riverbank edge, dynamic action, pixar 3d, cute",
"white bunny swimming scared in river water with bubbles around, big eyes wet fur, river water ripples, pixar cute, dramatic",
"giant green crocodile head close up next to small white bunny in water, crocodile yellow eyes sharp teeth friendly, water droplets, pixar 3d ultra realistic, cinematic",
"crocodile gently carrying white bunny with green vest in mouth to shore, sunset orange sky, water dripping, cute bunny scared but safe, pixar style",
"white bunny in green vest touching crocodile nose thank you, riverbank mud, sunset lighting, friendship, pixar 3d cute",
"white bunny and large crocodile sitting together on grass watching sunset over river, back view, orange sky, peaceful, text Persahabatan dalam Kejujuran, pixar ending"
];
function W(m){return new Promise(r=>setTimeout(r,m))}
async function loadImg(url){
 return new Promise((res,rej)=>{
  let im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{let c=document.createElement('canvas');c.width=10;c.height=10;let cc=c.getContext('2d');cc.drawImage(im,0,0,10,10);let d=cc.getImageData(0,0,10,10).data;let yellow=d[0]>200&&d[1]>180&&d[2]<100&&d[0]>d[2]+50;if(yellow)rej('yellow');else res(im);};
  im.onerror=()=>rej('err');im.src=url;
 });
}
function ease(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function lerp(a,b,t){return a+(b-a)*t}
async function make(){
 let st=document.getElementById('s'),cnt=document.getElementById('count'),pr=document.getElementById('p'),box=document.getElementById('box');
 box.style.display='block';pr.style.display='block';IM=[];
 for(let i=0;i<PROMPTS.length;i++){
  pr.value=(i/PROMPTS.length)*60;st.innerText='Gambar Mirip Asli '+(i+1)+'/'+PROMPTS.length+'...';
  let ok=false,attempt=0;
  while(!ok&&attempt<6){
   let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(PROMPTS[i])+'?width=720&height=1280&model=flux&enhance=true&seed='+Math.floor(Math.random()*999999)+'&nologo=true&_='+Date.now();
   try{let im=await loadImg(url);IM.push(im);ok=true;cnt.innerText='✅ Scene '+(i+1)+' cantik!';}
   catch(e){attempt++;cnt.innerText='Limit kuning, tunggu 45s... ('+attempt+')';
    for(let sec=45;sec>0;sec--){cnt.innerText='Anti kuning: '+sec+'s... scene '+(i+1)+'/'+PROMPTS.length;await W(1000);}}
  }
  if(i<PROMPTS.length-1&&ok){cnt.innerText='Tunggu biar gak kuning...';
   for(let sec=45;sec>0;sec--){cnt.innerText='Tunggu: '+sec+'s ('+(i+1)+'/'+PROMPTS.length+' selesai)';await W(1000);}}
 }
 st.innerText='Render Video Mirip Asli Halus 60fps...';pr.value=85;
 let stream=cv.captureStream(60);let rec=new MediaRecorder(stream,{mimeType:'video/webm'});let ch=[];
 rec.ondataavailable=e=>{if(e.data.size>0)ch.push(e.data)};
 rec.onstop=()=>{let b=new Blob(ch,{type:'video/webm'});let u=URL.createObjectURL(b);let vv=document.getElementById('v');vv.src=u;vv.style.display='block';let dl=document.getElementById('dl');dl.href=u;dl.download='MIRIP-ASLI-CANTIK.webm';dl.style.display='block';st.innerText='✅ VIDEO MIRIP ASLI JADI! CANTIK BANGET!';pr.value=100;cnt.innerText='';};
 rec.start(50);
 let start=Date.now(),total=30000,per=total/IM.length;
 function Draw(){
  let el=Date.now()-start;if(el>total){rec.stop();return;}
  let idx=Math.floor(el/per);if(idx>=IM.length)idx=IM.length-1;
  let prog=(el%per)/per;let e=ease(prog);
  let scale=lerp(1,1.25,e),x=lerp(-40,40,e),y=lerp(-20,20,e);
  cx.save();cx.fillRect(0,0,cv.width,cv.height);
  cx.translate(cv.width/2+x,cv.height/2+y);cx.scale(scale,scale);
  cx.drawImage(IM[idx],-cv.width/2,-cv.height/2,cv.width,cv.height);cx.restore();
  // cinematic vignette
  let grad=cx.createRadialGradient(cv.width/2,cv.height/2,0,cv.width/2,cv.height/2,cv.width);
  grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(0,0,0,0.25)');cx.fillStyle=grad;cx.fillRect(0,0,cv.width,cv.height);
  // text final scene
  if(idx==IM.length-1){cx.fillStyle='white';cx.font='bold 34px Arial';cx.textAlign='center';cx.shadowColor='black';cx.shadowBlur=8;cx.fillText('Persahabatan',cv.width/2,cv.height/2-10);cx.fillText('dalam Kejujuran',cv.width/2,cv.height/2+35);cx.shadowBlur=0;}
  cx.fillStyle='#06ffa5';cx.fillRect(0,cv.height-6,(el/total)*cv.width,6);
  requestAnimationFrame(Draw);
 }Draw();
}
</script>
</body>
</html>
