<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Children's Wonderland - Real Video</title>
<style>
body{font-family:Comic Sans MS;background:linear-gradient(135deg,#ffd6e8,#e0c3fc);margin:0;padding:15px;text-align:center}
.card{background:white;max-width:500px;margin:0 auto;border-radius:25px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.15)}
textarea{width:92%;height:110px;border-radius:15px;border:2px solid #ff8fab;padding:12px;font-size:14px}
.btn{background:#ff3e8d;color:white;border:none;padding:14px 20px;border-radius:30px;font-size:16px;font-weight:bold;margin:8px;cursor:pointer;width:92%}
#canvas{width:100%;border-radius:15px;background:black}
#status{margin:12px 0;font-weight:bold;color:#ff3e8d}
</style>
</head>
<body>
<div class="card">
<h1>🐰 Children's Wonderland 🦋<br>Text to REAL Video</h1>
<textarea id="prompt">Seekor kelinci coklat memakai tas wortel dan sepatu wortel berjalan di hutan mencari mawar kuning, bertemu kupu-kupu raksasa cantik, mereka berteman dan menemukan taman bunga warna warni</textarea>
<button class="btn" id="genBtn" onclick="generateVideo()">✨ Buat Video Beneran</button>
<button class="btn" style="background:#7b2cbf" onclick="speakStory()">🔊 Putar Suara</button>
<div id="status"></div>
<progress id="prog" value="0" max="100" style="display:none;width:90%"></progress>
<div id="videoContainer" style="display:none;margin-top:15px">
<canvas id="canvas" width="720" height="1280"></canvas>
<video id="resultVideo" controls style="width:100%;border-radius:15px;margin-top:10px;display:none"></video>
<a id="downloadLink" style="display:none;background:#00c853;color:white;padding:12px 20px;border-radius:25px;text-decoration:none;font-weight:bold;margin-top:10px;display:none">⬇️ Download Video</a>
<div id="imagesPreview"></div>
</div>
</div>
<script>
const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');let images=[];let recordedChunks=[];
function speakStory(){const t=document.getElementById('prompt').value;const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate=0.9;speechSynthesis.speak(u);}
async function generateVideo(){const btn=document.getElementById('genBtn');const status=document.getElementById('status');const prog=document.getElementById('prog');const container=document.getElementById('videoContainer');btn.disabled=true;btn.innerText='⏳ Sedang bikin video...';status.innerText='Membuat 3 gambar cerita...';prog.style.display='block';prog.value=10;container.style.display='block';document.getElementById('imagesPreview').innerHTML='';const scenes=[`cute brown bunny wearing carrot bag and carrot shoes walking in magical forest looking for yellow rose, kawaii 3d pixar style, bright colors, children's book illustration`,`cute brown bunny meeting giant beautiful blue butterfly in enchanted forest, friendship, magical glow, kawaii 3d pixar style`,`cute brown bunny and giant blue butterfly finding colorful flower garden with yellow roses, happy ending, rainbow flowers, kawaii 3d pixar style`];images=[];for(let i=0;i<3;i++){status.innerText=`Membuat gambar scene ${i+1}/3...`;prog.value=10+i*25;const seed=Math.floor(Math.random()*10000);const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(scenes[i])}?width=720&height=1280&seed=${seed}&nologo=true&model=flux`;try{const img=new Image();img.crossOrigin='anonymous';await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});images.push(img);const prev=document.createElement('img');prev.src=url;prev.style.width='100%';prev.style.borderRadius='12px';prev.style.marginTop='8px';document.getElementById('imagesPreview').appendChild(prev);}catch(e){status.innerText='Gagal load gambar, coba lagi...';btn.disabled=false;btn.innerText='✨ Buat Video Beneran';return;}}status.innerText='Menggabungkan jadi video 15 detik...';prog.value=85;const stream=canvas.captureStream(30);const recorder=new MediaRecorder(stream,{mimeType:'video/webm'});recordedChunks=[];recorder.ondataavailable=e=>{if(e.data.size>0)recordedChunks.push(e.data);};recorder.onstop=()=>{const blob=new Blob(recordedChunks,{type:'video/webm'});const url=URL.createObjectURL(blob);const v=document.getElementById('resultVideo');v.src=url;v.style.display='block';const dl=document.getElementById('downloadLink');dl.href=url;dl.download='kelinci-wonderland.webm';dl.style.display='block';status.innerText='✅ Video Kamu Jadi! Bisa di-download & share ke CapCut/TikTok!';prog.value=100;btn.disabled=false;btn.innerText='✨ Buat Lagi';speakStory();};recorder.start();let startTime=Date.now();let duration=15000;let sceneDuration=duration/3;function draw(){let elapsed=Date.now()-startTime;if(elapsed>duration){recorder.stop();return;}let sceneIndex=Math.floor(elapsed/sceneDuration);if(sceneIndex>2)sceneIndex=2;let sceneProgress=(elapsed%sceneDuration)/sceneDuration;let img=images[sceneIndex];let zoom=1+sceneProgress*0.3;let w=canvas.width*zoom;let h=canvas.height*zoom;let x=(canvas.width-w)/2-sceneProgress*20;let y=(canvas.height-h)/2-sceneProgress*10;ctx.fillStyle='black';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,x,y,w,h);ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,canvas.height-180,canvas.width,180);ctx.fillStyle='white';ctx.font='bold 22px Arial';ctx.textAlign='center';const texts=['Scene 1: Kelinci di hutan cari mawar','Scene 2: Bertemu kupu-kupu raksasa','Scene 3: Taman bunga warna-warni!'];ctx.fillText(texts[sceneIndex],canvas.width/2,canvas.height-100);ctx.font='16px Arial';ctx.fillText('🐰 Children Wonderland 🦋',canvas.width/2,canvas.height-50);requestAnimationFrame(draw);}draw();}
</script>
</body>
</html>
