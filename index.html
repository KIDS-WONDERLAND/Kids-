<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kelinci Buaya</title>
<style>
body{background:#dff5ff;font-family:Arial;text-align:center;padding:10px}
.card{max-width:500px;margin:auto;background:#fff;border-radius:20px;padding:15px}
textarea{width:90%;height:70px;border-radius:10px;padding:8px}
.btn{background:#ff3e8d;color:#fff;border:none;padding:12px;width:90%;border-radius:20px;margin:5px;font-weight:bold}
canvas,video{width:100%;border-radius:15px;background:#000;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h2>🐰 Kelinci & Buaya 🐊</h2>
<textarea id="t">Kelinci putih kejar kupu kuning jatuh sungai, buaya tolong jadi teman</textarea>
<button class="btn" onclick="go()">🎬 Buat Video</button>
<div id="s" style="color:red;font-weight:bold;margin:8px"></div>
<progress id="p" style="display:none;width:90%"></progress>
<div id="b" style="display:none">
<canvas id="c" width="720" height="1280"></canvas>
<video id="v" controls style="display:none"></video>
<a id="d" style="display:none;background:#0984e3;color:#fff;padding:10px;border-radius:15px;display:block;margin-top:8px;text-decoration:none">⬇️ Download</a>
<div id="r"></div>
</div>
</div>
<script>
let I=[];let cv=document.getElementById('c');let cx=cv.getContext('2d');
function W(m){return new Promise(o=>setTimeout(o,m))}
async function L(u){
 try{
  let im=new Image();im.crossOrigin='anonymous';
  await new Promise((a,b)=>{im.onload=a;im.onerror=b;im.src=u});
  return im;
 }catch{return null}
}
async function go(){
 let st=document.getElementById('s');
 let pr=document.getElementById('p');
 let box=document.getElementById('b');
 box.style.display='block';pr.style.display='block';
 document.getElementById('r').innerHTML='';I=[];
 let S=[
  ["Di tepi sungai","white bunny river bank yellow butterfly pixar"],
  ["Kejar kupu","white bunny reaching yellow butterfly pixar"],
  ["Jatuh sungai","white bunny falling river splash pixar"],
  ["Berenang","white bunny swimming scared pixar"],
  ["Buaya muncul","friendly crocodile river bunny pixar"],
  ["Buaya tolong","crocodile saving bunny river bank pixar"],
  ["Teman sunset","bunny crocodile friendship sunset pixar"]
 ];
 for(let i=0;i<S.length;i++){
  pr.value=i*14;
  st.innerText="Scene "+(i+1)+"/7: "+S[i][0]+"...";
  let url="https://image.pollinations.ai/prompt/"+encodeURIComponent(S[i][1])+"?width=720&height=1280&seed="+Math.floor(Math.random()*9999)+"&model=turbo&nologo=true";
  let im=await L(url);
  if(!im&&I.length>0)im=I[I.length-1];
  if(im){I.push(im);let x=document.createElement('img');x.src=im.src;x.style.width='100%';x.style.borderRadius='10px';document.getElementById('r').appendChild(x);}
  if(i<S.length-1)await W(8000);
 }
 st.innerText="Jadi film...";
 let stt=cv.captureStream(30);
 let rec=new MediaRecorder(stt);let ch=[];
 rec.ondataavailable=e=>{if(e.data.size>0)ch.push(e.data)};
 rec.onstop=()=>{
  let b=new Blob(ch,{type:'video/webm'});
  let u=URL.createObjectURL(b);
  let vv=document.getElementById('v');vv.src=u;vv.style.display='block';
  let dl=document.getElementById('d');dl.href=u;dl.download='kelinci-buaya.webm';dl.style.display='block';
  st.innerText="✅ VIDEO JADI!";
 };
 rec.start();
 let stime=Date.now();let tot=21000;let per=tot/S.length;
 function D(){
  let e=Date.now()-stime;if(e>tot){rec.stop();return}
  let idx=Math.floor(e/per);if(idx>=S.length)idx=S.length-1;
  let im=I[idx];if(!im){requestAnimationFrame(D);return}
  cx.fillRect(0,0,cv.width,cv.height);
  cx.drawImage(im,0,0,cv.width,cv.height);
  cx.fillStyle='rgba(0,0,0,0.5)';cx.fillRect(0,cv.height-120,cv.width,120);
  cx.fillStyle='white';cx.font='bold 20px Arial';cx.textAlign='center';
  cx.fillText(S[idx][0],cv.width/2,cv.height-50);
  if(idx==6){
   cx.font='bold 28px Arial';cx.fillText('Persahabatan',cv.width/2,cv.height/2-10);
   cx.font='bold 20px Arial';cx.fillText('dalam Kejujuran',cv.width/2,cv.height/2+20);
  }
  requestAnimationFrame(D);
 }D();
}
</script>
</body>
</html>
