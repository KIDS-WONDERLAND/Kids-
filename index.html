<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids Wonderland AI</title>

<style>
body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #17152f, #39245d);
  color: white;
  text-align: center;
}
.container {
  max-width: 600px;
  margin: 30px auto;
  padding: 25px;
  background: #ffffff12;
  border-radius: 20px;
}
h1 { color: #ffd86b; }
textarea, input, button {
  box-sizing: border-box;
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
}
textarea {
  height: 150px;
  resize: vertical;
}
button {
  background: #ffcf5c;
  color: #251442;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  opacity: .6;
  cursor: wait;
}
#status { line-height: 1.6; }
video {
  width: 100%;
  margin-top: 15px;
  border-radius: 12px;
  background: #111;
}
small { color: #ddd; }
</style>
</head>

<body>
<div class="container">
  <h1>🦄 Kids Wonderland AI</h1>
  <p>Buat video dari cerita imajinasimu!</p>

  <textarea id="story"
    placeholder="Contoh: Seekor kelinci cokelat menemukan bunga mawar ungu di hutan ajaib..."></textarea>

  <input id="token" type="password"
    placeholder="Token Hugging Face (jika diperlukan)">

  <button id="generate" onclick="buatVideo()">
    🎬 BUAT VIDEO AI
  </button>

  <p id="status">
    Masukkan cerita untuk memulai.
  </p>

  <video id="hasil" controls playsinline hidden></video>

  <a id="download" hidden download="kids-wonderland.mp4">
    <button type="button">⬇️ Unduh Video</button>
  </a>

  <small>
    Pembuatan video memerlukan model AI yang mendukung
    text-to-video dan akses API yang sesuai.
  </small>
</div>

<script>
async function buatVideo() {
  const cerita = document.getElementById("story").value.trim();
  const token = document.getElementById("token").value.trim();
  const status = document.getElementById("status");
  const tombol = document.getElementById("generate");

  if (!cerita) {
    alert("Masukkan cerita terlebih dahulu!");
    return;
  }

  if (!token) {
    alert("Masukkan token API Hugging Face terlebih dahulu!");
    return;
  }

  tombol.disabled = true;
  status.textContent = "Memeriksa akses model AI...";

  try {
    // Ganti dengan endpoint model text-to-video yang benar-benar
    // tersedia untuk akunmu dan mendukung inferensi API.
    const endpoint = prompt(
      "Masukkan URL endpoint model text-to-video Hugging Face:"
    );

    if (!endpoint || !endpoint.startsWith("https://")) {
      throw new Error("URL endpoint belum valid.");
    }

    status.textContent =
      "Mengirim cerita ke mesin AI. Tunggu prosesnya...";

    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        inputs: cerita
      })
    });

    if (!response.ok) {
      const detail = await response.text();
      throw new Error(
        "API gagal (" + response.status + "). " +
        detail.slice(0, 250)
      );
    }

    const data = await response.blob();

    if (!data.type.startsWith("video/")) {
      throw new Error(
        "Model tidak mengembalikan file video. " +
        "Model mungkin memerlukan format input atau proses lain."
      );
    }

    const url = URL.createObjectURL(data);
    const video = document.getElementById("hasil");
    const download = document.getElementById("download");

    video.src = url;
    video.hidden = false;
    download.href = url;
    download.hidden = false;

    status.textContent = "🎉 Video berhasil dibuat!";
  } catch (error) {
    status.textContent =
      "Belum berhasil membuat video: " + error.message;
  } finally {
    tombol.disabled = false;
  }
}
</script>
</body>
</html>
