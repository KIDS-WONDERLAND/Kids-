<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerak Halus 60fps</title>
<style>
body{background:#0f172a;color:#fff;font-family:Arial;text-align:center;padding:10px;margin:0}
.card{max-width:560px;margin:auto;background:#1e293b;border-radius:20px;padding:16px}
textarea{width:92%;height:85px;border-radius:12px;padding:10px}
.btn{background:linear-gradient(90deg,#ff3e8d,#06ffa5);color:#000;border:none;padding:14px;width:92%;border-radius:25px;font-weight:bold;margin:6px;cursor:pointer;font-size:16px}
canvas,video{width:100%;border-radius:16px;background:#000;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h2>✨ GERAK HALUS 60FPS</h2>
<p style="font-size:11px;color:#94a3b8">Objek bergerak mulus, bukan diam!</p>
<textarea id="story">Kelinci putih kecil lari mengejar kupu kuning di tepi sungai, terpeleset jatuh ke sungai berenang ketakutan, buaya besar muncul menolongnya, akhirnya mereka berteman sunset</textarea>
<button class="btn" onclick="make()">🎬 BUAT VIDEO HALUS 30 DETIK</button>
<div id="s" style="color:#06ffa5;font-weight:bold;margin:8px"></div>
<progress id="p" style="display:none;width:90%"></progress>
<div id="box" style="display:none">
<canvas id="c" width="720" height="1280"></canvas>
<video id="v" controls style="display:none"></video>
<a id="dl" style="display:none;background:#3b82f6;color:#fff;padding:12px;border-radius:15px;display:block;margin-top:8px;text-decoration:none;font-weight:bold">⬇️ Download Video Halus</a>
</div>
</div>
<script>
let IM=[];let cv=document.getElementById('c');let cx=cv.getContext('2d');
function W(m){return new Promise(r=>setTimeout(r,m))}
async function L(u){try{let im=new Image();im.crossOrigin='anonymous';await new Promise((a,b)=>{im.onload=a;im.onerror=b;setTimeout(b,10000);im.src=u});return im}catch{return null}}
function split(t){let a=t.split(/[,.\n]+/).filter(x=>x.trim().length>8);if(a.length<4){let m=Math.floor(t.length/4);a=[t.slice(0,m),t.slice(m,m*2),t.slice(m*2,m*3),t.slice(m*3)];}if(a.length>5)a=a.slice(0,5);return a.map(x=>x.trim());}
function ease(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function lerp(a,b,t){return a+(b-a)*t}
async function make(){
 let st=document.getElementById('s'),pr=document.getElementById('p'),box=document.getElementById('box');
 let txt=document.getElementById('story').value;box.style.display='block';pr.style.display='block';IM=[];
 let scenes=split(txt);
 for(let i=0;i<scenes.length;i++){
  pr.value=(i/scenes.length)*70;st.innerText='Bikin scene '+(i+1)+'/'+scenes.length;
  let url='https://image.pollinations.ai/prompt/'+encodeURIComponent('pixar 3d cute '+scenes[i]+' cinematic')+'?width=720&height=1280&seed='+Math.floor(Math.random()*99999)+'&model=turbo&nologo=true';
  let im=await L(url);if(im)IM.push({img:im,text:scenes[i]});if(i<scenes.length-1)await W(5500);
 }
 st.innerText='Render HALUS 60fps...';
 let stream=cv.captureStream(60);let rec=new MediaRecorder(stream,{mimeType:'video/webm'});let ch=[];
 rec.ondataavailable=e=>{if(e.data.size>0)ch.push(e.data)};
 rec.onstop=()=>{let b=new Blob(ch,{type:'video/webm'});let u=URL.createObjectURL(b);let vv=document.getElementById('v');vv.src=u;vv.style.display='block';let dl=document.getElementById('dl');dl.href=u;dl.download='halus-60fps.webm';dl.style.display='block';st.innerText='✅ VIDEO HALUS JADI!';pr.value=100;};
 rec.start(50);
 let start=Date.now();let total=30000;let per=total/IM.length;
 let lastX=0,lastY=0;
 function Draw(){
  let el=Date.now()-start;if(el>total){rec.stop();return;}
  let idx=Math.floor(el/per);if(idx>=IM.length)idx=IM.length-1;
  let prog=(el%per)/per;let e=ease(prog);
  let d=IM[idx];if(!d){requestAnimationFrame(Draw);return;}
  let im=d.img;
  // === GERAK HALUS LOGIC ===
  let targetX=0,targetY=0,scale=1,rot=0;
  if(idx==0){ // di tepi sungai - jalan pelan
   targetX=lerp(-200,200,e);targetY=Math.sin(el*0.003)*15;scale=1+Math.sin(el*0.002)*0.05;
  }else if(idx==1){ // kejar kupu - lari cepat + loncat
   targetX=lerp(-250,250,e);targetY=Math.abs(Math.sin(e*10))* -60;scale=1.05;rot=Math.sin(e*10)*0.05;
  }else if(idx==2){ // jatuh - gravitasi halus
   let fallE=e*e;targetY=lerp(-150,300,fallE);targetX=lerp(0,-80,fallE);scale=lerp(1,1.2,fallE);rot=e*0.4;
  }else if(idx==3){ // berenang - goyang halus
   targetX=Math.sin(el*0.004)*40;targetY=Math.sin(el*0.003)*20;rot=Math.sin(el*0.004)*0.1;scale=1;
  }else{ // buaya & teman - zoom halus
   targetX=Math.sin(el*0.001)*30;targetY=Math.sin(el*0.0015)*15;scale=lerp(0.9,1.15,e);
  }
  // smooth interpolation (lerp) biar gak patah
  lastX=lerp(lastX,targetX,0.08);lastY=lerp(lastY,targetY,0.08);
  cx.fillStyle='#000';cx.fillRect(0,0,cv.width,cv.height);
  // motion blur effect
  cx.globalAlpha=0.15;cx.drawImage(im,lastX*0.95,cv.height*0.02+lastY*0.95,cv.width,cv.height);
  cx.globalAlpha=1;
  cx.save();cx.translate(cv.width/2+lastX,cv.height/2+lastY);cx.rotate(rot);cx.scale(scale,scale);
  // bayangan bawah
  cx.shadowColor='rgba(0,0,0,0.4)';cx.shadowBlur=20;cx.shadowOffsetY=20;
  cx.drawImage(im,-cv.width/2,-cv.height/2,cv.width,cv.height);cx.restore();
  // partikel halus
  if(idx==2){cx.fillStyle='rgba(120,200,255,'+(1-e)*0.6+')';for(let k=0;k<12;k++){cx.beginPath();cx.arc(Math.random()*cv.width,cv.height*0.6+Math.random()*200,Math.random()*6,0,6.28);cx.fill();}}
  // text halus fade
  cx.fillStyle='rgba(0,0,0,0.6)';cx.fillRect(0,cv.height-150,cv.width,150);
  cx.fillStyle='white';cx.font='bold 20px Arial';cx.textAlign='center';
  cx.globalAlpha=0.9+Math.sin(el*0.005)*0.1;cx.fillText(d.text.substring(0,38),cv.width/2,cv.height-70);cx.globalAlpha=1;
  if(idx==IM.length-1){cx.fillStyle='rgba(0,0,0,0.35)';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle='white';cx.font='bold 34px Arial';cx.fillText('Persahabatan',cv.width/2,cv.height/2-10);cx.font='bold 24px Arial';cx.fillText('dalam Kejujuran',cv.width/2,cv.height/2+30);}
  let bar=(el/total)*cv.width;cx.fillStyle='#06ffa5';cx.fillRect(0,cv.height-5,bar,5);
  requestAnimationFrame(Draw);
 }Draw();
}
</script>
</body>
</html>
