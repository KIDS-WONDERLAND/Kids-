<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PICSART FINAL</title>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;text-align:center;padding:10px;margin:0}
.card{background:#1e293b;max-width:560px;margin:auto;border-radius:20px;padding:16px}
textarea{width:92%;height:75px;border-radius:12px;padding:10px}
.btn{background:linear-gradient(90deg,#ff3e8d,#06ffa5);color:#000;border:none;padding:15px;width:92%;border-radius:25px;font-weight:bold;margin:6px;font-size:17px}
canvas,video{width:100%;border-radius:16px;background:#000;margin-top:10px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.f{padding:8px 14px;border-radius:20px;background:#334155;color:#fff;border:none;font-size:12px;cursor:pointer}
.f.active{background:#ff3e8d}
</style>
</head>
<body>
<div class="card">
<h2>✨ PICSART FINAL 3D</h2>
<p style="color:#06ffa5;font-size:11px">Filter Aesthetic + Sparkle + Stiker</p>
<textarea id="story">Kelinci putih lucu lari kejar kupu kuning cantik di tepi sungai, terpeleset jatuh ke sungai berenang ketakutan, buaya hijau baik hati menolongnya, mereka berteman melihat sunset indah, persahabatan dalam kejujuran</textarea>
<div class="filters">
<button class="f active" onclick="setF('picsart',this)">🌸 Picsart</button>
<button class="f" onclick="setF('warm',this)">🔥 Warm</button>
<button class="f" onclick="setF('pink',this)">💖 Pink</button>
<button class="f" onclick="setF('vintage',this)">📸 Vintage</button>
<button class="f" onclick="setF('dreamy',this)">✨ Dreamy</button>
</div>
<button class="btn" onclick="make()">🎨 BUAT VIDEO PICSART 30 DETIK</button>
<div id="s" style="color:#06ffa5;font-weight:bold;margin:8px"></div>
<div id="count" style="color:#fbbf24;font-size:13px"></div>
<progress id="p" style="display:none;width:90%"></progress>
<div id="box" style="display:none">
<canvas id="c" width="720" height="1280"></canvas>
<video id="v" controls style="display:none"></video>
<a id="dl" style="display:none;background:#3b82f6;color:#fff;padding:12px;border-radius:15px;display:block;margin-top:8px;text-decoration:none;font-weight:bold">⬇️ Download Video Picsart</a>
</div>
</div>
<script>
let cv=document.getElementById('c'),cx=cv.getContext('2d'),IM=[],FILTER='picsart';
function setF(f,el){FILTER=f;document.querySelectorAll('.f').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function W(m){return new Promise(r=>setTimeout(r,m))}
async function loadImg(url){
 return new Promise((res,rej)=>{
  let im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{let c=document.createElement('canvas');c.width=10;c.height=10;let cc=c.getContext('2d');cc.drawImage(im,0,0,10,10);let d=cc.getImageData(0,0,10,10).data;let yellow=d[0]>200&&d[1]>180&&d[2]<100;if(yellow){rej('yellow');}else res(im);};
  im.onerror=()=>rej('err');im.src=url;
 });
}
function split(t){let a=t.split(/[,.\n]+/).filter(x=>x.trim().length>10);if(a.length<3){let m=Math.floor(t.length/3);a=[t.slice(0,m),t.slice(m,m*2),t.slice(m*2)];}if(a.length>4)a=a.slice(0,4);return a.map(x=>x.trim());}
function ease(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function lerp(a,b,t){return a+(b-a)*t}
async function make(){
 let st=document.getElementById('s'),cnt=document.getElementById('count'),pr=document.getElementById('p'),box=document.getElementById('box');
 box.style.display='block';pr.style.display='block';IM=[];
 let scenes=split(document.getElementById('story').value);
 for(let i=0;i<scenes.length;i++){
  pr.value=(i/scenes.length)*50;st.innerText='Gambar Picsart '+(i+1)+'/'+scenes.length+'...';
  let ok=false,attempt=0;
  while(!ok&&attempt<5){
   let prompt='pixar 3d cute, aesthetic picsart style, '+scenes[i]+', soft bokeh, dreamy lighting, highly detailed, 8k, cute, vibrant';
   let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(prompt)+'?width=720&height=1280&model=flux&seed='+Math.floor(Math.random()*999999)+'&nologo=true&_='+Date.now();
   try{let im=await loadImg(url);IM.push({img:im,text:scenes[i]});ok=true;cnt.innerText='';}
   catch(e){attempt++;cnt.innerText='Tunggu anti kuning '+attempt+'/5';
    for(let sec=45;sec>0;sec--){cnt.innerText='Anti kuning: '+sec+'s...';await W(1000);}}
  }
  if(i<scenes.length-1&&ok){for(let sec=45;sec>0;sec--){cnt.innerText='Tunggu biar cantik: '+sec+'s ('+(i+1)+'/'+scenes.length+')';await W(1000);}}
 }
 st.innerText='Render Picsart Aesthetic 60fps...';pr.value=80;
 let stream=cv.captureStream(60);let rec=new MediaRecorder(stream,{mimeType:'video/webm'});let ch=[];
 rec.ondataavailable=e=>{if(e.data.size>0)ch.push(e.data)};
 rec.onstop=()=>{let b=new Blob(ch,{type:'video/webm'});let u=URL.createObjectURL(b);let vv=document.getElementById('v');vv.src=u;vv.style.display='block';let dl=document.getElementById('dl');dl.href=u;dl.download='PICSART-3D.webm';dl.style.display='block';st.innerText='✅ VIDEO PICSART JADI!';pr.value=100;cnt.innerText='';};
 rec.start(50);
 let start=Date.now(),total=30000,per=total/IM.length,sparkles=[];
 for(let i=0;i<25;i++)sparkles.push({x:Math.random()*720,y:Math.random()*1280,s:Math.random()*3+1,spd:Math.random()*2+0.5});
 function Draw(){
  let el=Date.now()-start;if(el>total){rec.stop();return;}
  let idx=Math.floor(el/per);if(idx>=IM.length)idx=IM.length-1;
  let prog=(el%per)/per;let e=ease(prog);let d=IM[idx];
  let scale=lerp(1,1.25,e);let x=lerp(-50,50,e);let y=lerp(-25,25,e);
  cx.save();
  if(FILTER=='warm')cx.filter='sepia(0.2) saturate(1.3) brightness(1.1)';
  else if(FILTER=='pink')cx.filter='hue-rotate(320deg) saturate(1.4) brightness(1.1)';
  else if(FILTER=='vintage')cx.filter='sepia(0.4) contrast(1.1) brightness(1.05)';
  else if(FILTER=='dreamy')cx.filter='blur(0.3px) brightness(1.15) saturate(1.3)';
  else cx.filter='saturate(1.25) contrast(1.1) brightness(1.05)';
  cx.fillRect(0,0,cv.width,cv.height);
  cx.translate(cv.width/2+x,cv.height/2+y);cx.scale(scale,scale);
  cx.drawImage(d.img,-cv.width/2,-cv.height/2,cv.width,cv.height);
  cx.restore();
  // picsart sparkle bokeh
  sparkles.forEach(s=>{s.y-=s.spd;if(s.y<0)s.y=1280;cx.fillStyle='rgba(255,255,255,'+(0.3+Math.sin(el*0.005+s.x)*0.3)+')';cx.beginPath();cx.arc(s.x,s.y,s.s,0,6.28);cx.fill();if(Math.random()>0.98){cx.fillStyle='rgba(255,200,255,0.8)';cx.beginPath();cx.arc(s.x,s.y,6,0,6.28);cx.fill();}});
  // picsart vignette + gradient
  let grad=cx.createRadialGradient(cv.width/2,cv.height/2,0,cv.width/2,cv.height/2,cv.width);
  grad.addColorStop(0,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(0,0,0,0.35)');cx.fillStyle=grad;cx.fillRect(0,0,cv.width,cv.height);
  // picsart text aesthetic
  cx.fillStyle='rgba(0,0,0,0.5)';cx.fillRect(0,cv.height-150,cv.width,150);
  cx.fillStyle='white';cx.font='bold 22px Arial';cx.textAlign='center';cx.shadowColor='rgba(255,62,141,0.8)';cx.shadowBlur=10;cx.fillText(d.text.substring(0,38),cv.width/2,cv.height-75);cx.shadowBlur=0;
  // picsart sticker
  cx.font='28px Arial';cx.fillText('✨🦋💖',cv.width-90,80+Math.sin(el*0.004)*10);
  cx.fillStyle='#06ffa5';cx.fillRect(0,cv.height-5,(el/total)*cv.width,5);
  requestAnimationFrame(Draw);
 }Draw();
}
</script>
</body>
</html>
